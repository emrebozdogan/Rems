<div class="row h-100 g-3">
  <div class="col-md-9 h-100">
    <div class="card border shadow-sm position-relative h-100">
      <div id="map" class="w-100 h-100 rounded"></div>

      <div class="position-absolute top-0 start-50 translate-middle-x mt-3" style="z-index: 1000; width: 80%;">
        @if (successMessage) {
        <div class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
          {{ successMessage }}
          <button type="button" class="btn-close" (click)="successMessage = null"></button>
        </div>
        }
        @if (errorMessage) {
        <div class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
          {{ errorMessage }}
          <button type="button" class="btn-close" (click)="errorMessage = null"></button>
        </div>
        }
      </div>
    </div>
  </div>

  <div class="col-md-3 h-100">
    <div class="card border shadow-sm h-100">
      <div class="card-header bg-white border-bottom">
        <h5 class="card-title mb-0">Area Analysis</h5>
      </div>

      <div class="card-body d-flex flex-column gap-3">
        @if (!mode) {
        <div class="d-flex flex-column gap-2">
          <label class="form-label fw-bold text-secondary">Select Mode</label>
          <button class="btn btn-outline-primary" (click)="selectManualDraw()">
            <i class="bi bi-pencil-square me-2"></i>Manual Draw
          </button>
          <button class="btn btn-outline-success" (click)="selectAutoSelect()">
            <i class="bi bi-magic me-2"></i>Auto-Select
          </button>
        </div>
        }

        @if (mode) {
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="badge bg-secondary">{{ mode }} Mode</span>
          <button class="btn btn-sm btn-outline-danger" (click)="reset()">Reset</button>
        </div>

        <div class="d-flex flex-column gap-2">
          <label class="form-label fw-bold text-secondary">Operations</label>
          <button class="btn btn-primary" (click)="computeIntersectionAB()" [disabled]="polygons.length < 3">
            Compute A ∩ B
          </button>
          <button class="btn btn-primary" (click)="computeIntersectionBA()" [disabled]="polygons.length < 3">
            Compute B \ A
          </button>
          <button class="btn btn-success" (click)="computeUnionAB()" [disabled]="polygons.length < 3">
            Compute A ∪ B
          </button>
          <button class="btn btn-success" (click)="computeUnionABC()" [disabled]="polygons.length < 3">
            Compute A ∪ B ∪ C
          </button>
          @if (surfaceArea !== null) {
          <button class="btn btn-info text-white mt-2 shadow-sm" (click)="showOriginals()">
            <i class="bi bi-eye me-2"></i>Show Originals (A, B, C)
          </button>
          }
        </div>

        <hr class="text-muted">

        <div class="d-flex flex-column gap-2 mt-auto">
          <button class="btn btn-warning w-100" (click)="clearMap()">Clear Map</button>
        </div>
        }
      </div>

      <!-- Result Section -->
      @if (surfaceArea !== null) {
      <div class="card-footer bg-light border-top">
        <div class="d-flex flex-column text-center">
          <small class="text-secondary fw-bold text-uppercase">Computed Surface Area</small>
          <h4 class="text-primary mb-0 mt-1">{{ surfaceArea | number:'1.2-2' }} <small>m²</small></h4>
        </div>
      </div>
      }
    </div>
  </div>
</div>
